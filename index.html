<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ujjawal Kumar</title>
<meta name="description" content="Software built and sold by Ujjawal Kumar.">
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafaf8;
    --muted: #6b6b6b;
    --line: #e2e0da;
    --accent: #1f3a5f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 96px 24px 64px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .tagline {
    color: var(--muted);
    font-size: 18px;
    margin: 0 0 56px;
  }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 20px;
    font-weight: 600;
  }
  .products {
    list-style: none;
    margin: 0 0 56px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .product {
    display: block;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 24px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .product:hover, .product:focus-visible {
    border-color: var(--accent);
    transform: translateX(2px);
  }
  .product-name {
    font-weight: 600;
    font-size: 17px;
    margin-bottom: 4px;
  }
  .product-desc {
    color: var(--muted);
    font-size: 15px;
  }
  footer {
    border-top: 1px solid var(--line);
    padding-top: 24px;
    font-size: 14px;
    color: var(--muted);
  }
  footer a { color: inherit; }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f0efe9;
      --paper: #16161a;
      --muted: #9a9990;
      --line: #2c2c30;
      --accent: #7fa8d9;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Ujjawal Kumar</h1>
    <p class="tagline">I build small, focused software and sell it directly.</p>

    <h2>Products</h2>
    <ul class="products">
      <li>
        <a class="product" href="/curbcut/">
          <div class="product-name">curbcut</div>
          <div class="product-desc">Client-ready WCAG 2.1 AA accessibility audit reports. Point it at a URL, get a branded PDF an agency can hand to a client and charge for.</div>
        </a>
      </li>
    </ul>

    <footer>
      <p>Contact: <a href="mailto:support@ujjawalkumar.dev">support@ujjawalkumar.dev</a></p>
    </footer>
  </div>
</body>
</html>
